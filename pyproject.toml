[project]
name = "vibe-emulator-scripts"
version = "1.0.0"
description = "Python scripts for vibe-emulator task tracking and automation"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
markers = [
    "slow: marks tests as slow (subprocess-heavy)",
    "integration: marks tests as integration tests",
]
addopts = "-n auto"