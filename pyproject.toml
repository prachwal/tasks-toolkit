[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasks-toolkit"
version = "0.1.6"
description = "Task tracker toolkit: CLI + MCP server for sprint/task/subtask management, delegation helpers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "prachwal" }]
keywords = ["mcp", "task-tracker", "cli", "sprints"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8", "pytest-xdist>=3"]
[project.urls]
Homepage = "https://github.com/prachwal/tasks-toolkit"
Repository = "https://github.com/prachwal/tasks-toolkit"
Issues = "https://github.com/prachwal/tasks-toolkit/issues"

[project.scripts]
tasks = "scripts.tasks:main"
tasks-init = "scripts.tasks_init:main"
tasks-mcp = "scripts.tasks_mcp:main"
tasks-run = "scripts.task_runner:main"
tasks-sprint = "scripts.sprint_auto:main"

[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.package-data]
scripts = ["*.sh"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
markers = [
  "slow: marks tests as slow (subprocess-heavy)",
  "integration: marks tests as integration tests",
]
addopts = "-n 2"
